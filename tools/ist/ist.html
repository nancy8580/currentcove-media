<script type="importmap">{"imports":{"d3-geo":"./node_modules/d3-geo/src/index.js","d3-array":"./node_modules/d3-array/dist/d3-array.mjs","internmap":"./node_modules/internmap/src/index.js","topojson-client":"./node_modules/topojson-client/src/index.js"}}</script>
</head><body><canvas id=c width=1080 height=1920></canvas><script type="module">
import {geoMercator,geoPath,geoCircle,geoGraticule} from 'd3-geo';
import * as topo from 'topojson-client'; import W from './world.js';
const C=document.getElementById('c'),X=C.getContext('2d');
const ACC='#ffb547',TEAL='#2ee6c5',WH='#f1f5fb',SEA='#06101f',LAND='#16263f',LANDE='#2a4166',IND='#24406a';
const cl=x=>Math.min(1,Math.max(0,x)),ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},lerp=(a,b,k)=>a+(b-a)*k;
const countries=topo.feature(W,W.objects.countries).features, land=topo.feature(W,W.objects.land);
const INDIA=countries.find(f=>f.properties.name==='India');
const MC=[540,1030];
const proj=geoMercator().center([82.5,22]).scale(1500).translate(MC);
const P=geoPath(proj,X);
const GJ=[68.7,23.2],AR=[97.0,28.0],MZ=[82.57,25.15],AS=[93.2,26.4];
const grat=geoGraticule().step([5,5])();
function glow(c,b){X.shadowColor=c;X.shadowBlur=b}
function pin(p,lab,k,col=WH,dy=-26,align='center'){const s=proj(p);const b=back(k);X.save();X.globalAlpha=cl(k*2);X.fillStyle=col;glow(col,20);X.beginPath();X.arc(s[0],s[1],Math.max(.01,11*b),0,7);X.fill();X.shadowBlur=0;X.font='700 32px IN';X.textAlign=align;X.fillText(lab,s[0]+(align==='left'?18:align==='right'?-18:0),s[1]+dy);X.restore()}
function head(str,y,t0,t,size=72){X.save();X.font=`800 ${size}px IN`;const ws=str.split(' ');let x=70,yy=y;ws.forEach((w,i)=>{const acc=w.includes('*'),ww=w.replace(/\*/g,'');const mw=X.measureText(ww+' ').width;if(x+mw>1010){x=70;yy+=size*1.12}const k=cl((t-t0-i*.06)/.3);X.globalAlpha=k;X.fillStyle=acc?ACC:WH;X.fillText(ww,x,yy+(1-ease(k))*14);x+=mw});X.restore()}
function sub(text,t0,dur,t){const ws=text.split(' '),chunks=[];for(let i=0;i<ws.length;i+=6)chunks.push(ws.slice(i,i+6).join(' '));const k=cl((t-t0)/dur),ci=Math.min(chunks.length-1,Math.floor(k*chunks.length));
  X.save();X.font='600 44px IN';X.textAlign='center';const s=chunks[ci],w=X.measureText(s).width+48;X.fillStyle='rgba(6,16,31,.8)';X.beginPath();X.roundRect(540-w/2,1572,w,72,14);X.fill();X.fillStyle=WH;X.fillText(s,540,1622);X.restore()}
function big(s,x,y,col,size,a){X.save();X.globalAlpha=a;X.font=`900 ${size}px IN`;X.fillStyle=col;X.textAlign='center';glow(col,26);X.fillText(s,x,y);X.restore()}
function clock(cx,cy,r,hh,mm,a,col=ACC){X.save();X.globalAlpha=a;X.strokeStyle=col;X.lineWidth=6;glow(col,18);X.beginPath();X.arc(cx,cy,r,0,7);X.stroke();
  for(let i=0;i<12;i++){const an=i*Math.PI/6;X.beginPath();X.moveTo(cx+Math.cos(an)*r*.82,cy+Math.sin(an)*r*.82);X.lineTo(cx+Math.cos(an)*r*.92,cy+Math.sin(an)*r*.92);X.lineWidth=3;X.stroke()}
  const ha=((hh%12)+mm/60)/12*2*Math.PI-Math.PI/2,ma=mm/60*2*Math.PI-Math.PI/2;X.lineWidth=8;X.beginPath();X.moveTo(cx,cy);X.lineTo(cx+Math.cos(ha)*r*.5,cy+Math.sin(ha)*r*.5);X.stroke();X.lineWidth=5;X.beginPath();X.moveTo(cx,cy);X.lineTo(cx+Math.cos(ma)*r*.78,cy+Math.sin(ma)*r*.78);X.stroke();X.restore()}
let SC=[],TOTAL=45;window.setT=(s,T)=>{SC=s;TOTAL=T};
window.frame=(t)=>{X.setTransform(1,0,0,1,0,0);X.fillStyle=SEA;X.fillRect(0,0,1080,1920);
 const sc=SC.find(s=>t>=s[1]&&t<s[2])||SC[SC.length-1],id=sc[0],lt=t-sc[1];
 // gentle camera drift
 const zoom={hook:1+lt*.01,sun:1.02,line:1.05,math:1.0,tea:1.25,end:.9}[id]||1;
 const cen={tea:[88,24],end:[82.5,22]}[id]||[82.5,22];
 proj.scale(1500*zoom).center(cen);
 const dim=id==='math'||id==='end'?.35:1;
 X.save();X.globalAlpha=dim;X.beginPath();P(grat);X.strokeStyle='rgba(120,160,210,.10)';X.lineWidth=1;X.stroke();
 X.beginPath();P(land);X.fillStyle=LAND;X.fill();X.strokeStyle=LANDE;X.lineWidth=1.2;X.stroke();
 const draw=id==='hook'?ease((lt-.2)/1.6):1;
 X.beginPath();P(INDIA);X.fillStyle=IND;X.globalAlpha=dim*draw;X.fill();X.globalAlpha=dim;X.save();X.strokeStyle=TEAL;X.lineWidth=3;glow(TEAL,14);X.setLineDash([4000]);X.lineDashOffset=4000*(1-draw);X.stroke();X.restore();X.restore();
 if(id==='hook'){const k=ease((lt-1.8)/1.6);const a=proj(GJ),b=proj(AR);X.save();X.strokeStyle=ACC;X.lineWidth=6;glow(ACC,18);X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(lerp(a[0],b[0],k),lerp(a[1],b[1],k));X.stroke();X.restore();
   pin(GJ,'Gujarat',(lt-1.6)/.4,WH,48);pin(AR,'Arunachal',(lt-3.2)/.4,WH,48);
   if(lt>3.4){X.save();X.globalAlpha=cl((lt-3.4)/.4);X.font='800 56px IN';X.fillStyle=ACC;X.textAlign='center';glow(ACC,20);X.fillText('≈ 2,933 km',(a[0]+b[0])/2,(a[1]+b[1])/2-40);X.restore()}}
 if(id==='sun'){ // night shadow sweeping west: sunrise passes Arunachal first, Gujarat ~2h later
   const lon=lerp(194,150,ease(lt/5.6)); // subsolar longitude moves west
   const night=geoCircle().center([lon+180,18]).radius(90)();
   X.save();X.beginPath();P(night);X.fillStyle='rgba(2,6,14,.72)';X.fill();X.restore();
   const term=lon-90; // sunrise line longitude approx (morning terminator)
   const s=proj([term,22]);if(s[0]>0&&s[0]<1080){X.save();const g=X.createLinearGradient(s[0]-80,0,s[0]+80,0);g.addColorStop(0,'rgba(255,181,71,0)');g.addColorStop(.5,'rgba(255,181,71,.55)');g.addColorStop(1,'rgba(255,181,71,0)');X.fillStyle=g;X.fillRect(s[0]-80,560,160,960);X.restore()}
   const sunrise=(p)=>term<p[0]+0.5; pin(AR,sunrise(AR)?'☀ sunrise':'Arunachal',1,sunrise(AR)?ACC:WH,48);pin(GJ,sunrise(GJ)?'☀ sunrise':'Gujarat',1,sunrise(GJ)?ACC:WH,48);
   if(lt>3.8)big('≈ 2 hours apart',540,1430,ACC,70,cl((lt-3.8)/.4))}
 if(id==='line'){const k=ease((lt-.3)/1.4);const top=proj([82.5,36]),bot=proj([82.5,6]);X.save();X.strokeStyle=ACC;X.lineWidth=7;glow(ACC,24);X.beginPath();X.moveTo(top[0],top[1]);X.lineTo(top[0],lerp(top[1],bot[1],k));X.stroke();X.restore();
   if(lt>1.4){X.save();X.globalAlpha=cl((lt-1.4)/.4);X.font='800 54px JB';X.fillStyle=ACC;X.textAlign='left';glow(ACC,18);X.fillText('82.5° E',top[0]+24,top[1]+150);X.restore()}
   pin(MZ,'Mirzapur, UP',(lt-2.6)/.4,WH,10,'left')}
 if(id==='math'){const k1=cl((lt-.3)/.3),k2=cl((lt-2.2)/.3),k3=cl((lt-4.6)/.4);
   big('15° = 1 hour',540,760,WH,80,k1);big('82.5° ÷ 15 = 5.5',540,940,ACC,90,k2);
   const hh=5,mm=Math.round(30*ease((lt-4.6)/1.6));clock(540,1180,120,hh,mm,k3);big(`UTC +5:${String(mm).padStart(2,'0')}`,540,1440,TEAL,96,k3)}
 if(id==='tea'){const s=proj(AS);const pul=1+.08*Math.sin(t*4);X.save();X.globalAlpha=cl(lt/.5);const g=X.createRadialGradient(s[0],s[1],0,s[0],s[1],170*pul);g.addColorStop(0,'rgba(46,230,197,.55)');g.addColorStop(1,'rgba(46,230,197,0)');X.fillStyle=g;X.beginPath();X.arc(s[0],s[1],170*pul,0,7);X.fill();X.restore();
   pin(AS,'Assam tea gardens',(lt-.4)/.4,WH,-34);const k=cl((lt-1.4)/.4);const hh=lt>3?6:5,mm=lt>3?30:30;clock(800,1380,90,lerp(5,6,ease((lt-2.6)/1.2)),30,k,TEAL);
   X.save();X.globalAlpha=k;X.font='800 46px IN';X.fillStyle=TEAL;X.textAlign='left';X.fillText('IST + 1 hour',120,1360);X.font='600 34px IN';X.fillStyle=WH;X.fillText('"chai bagan time"',120,1410);X.restore()}
 const H={hook:'Why does India run on *one* clock?',sun:'The sun rises *2 hours* apart.',line:'So India picked the *middle*.',math:'That\'s where *+5:30* comes from.',tea:'Assam\'s tea gardens *disagree*.',end:'Follow for more things you never *questioned.*'};
 head(H[id],id==='end'?820:330,sc[1]+.1,t,id==='end'?84:72);
 X.save();X.font='500 24px JB';X.fillStyle='#6f84a6';X.fillText('CURRENT COVE · INDIA CURIOSITIES',70,190);X.restore();
 if(id!=='end') sub(sc[4],sc[1]+.3,sc[3],t);
 X.save();X.font='500 26px JB';X.fillStyle='#4f6688';X.textAlign='center';X.fillText('@currentcove_',540,1800);X.restore();
 if(t>TOTAL-.6){X.fillStyle=`rgba(6,16,31,${(t-TOTAL+.6)/.6})`;X.fillRect(0,0,1080,1920)}
};
await document.fonts.load('800 60px IN');await document.fonts.load('500 20px JB');window.go=true;
</script></body></html>
