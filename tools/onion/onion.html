// Scrapbook collage style (kitchen edition): aubergine construction paper, torn cut-outs, washi tape, polaroids, marker scribbles, yellow accent.
const C=document.getElementById('c'),X=C.getContext('2d');

const cl=x=>Math.min(1,Math.max(0,x)),ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},back=x=>{x=cl(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},lerp=(a,b,k)=>a+(b-a)*k;

// torn paper rectangle path, centred at 0,0
function tornPath(w,h,seed,j=7){X.beginPath();const st=16;let i=0;
  for(let x=-w/2;x<=w/2;x+=st)X.lineTo(x,-h/2+(hsh(seed+i++)-.5)*j);
  for(let y=-h/2;y<=h/2;y+=st)X.lineTo(w/2+(hsh(seed+i++)-.5)*j,y);
  for(let x=w/2;x>=-w/2;x-=st)X.lineTo(x,h/2+(hsh(seed+i++)-.5)*j);
  for(let y=h/2;y>=-h/2;y-=st)X.lineTo(-w/2+(hsh(seed+i++)-.5)*j,y);X.closePath()}
function torn(x,y,w,h,col,seed,rot=0,sc=1,a=1){if(a<=0||sc<=0)return;X.save();X.globalAlpha=cl(a);X.translate(x,y);X.rotate(rot);X.scale(sc,sc);shadow(1);X.fillStyle=col;tornPath(w,h,seed);X.fill();shadow(0);X.restore()}
function tape(x,y,w,rot,col='rgba(200,240,74,.7)',a=1){if(a<=0)return;X.save();X.globalAlpha=cl(a);X.translate(x,y);X.rotate(rot);X.fillStyle=col;X.beginPath();const h=46;for(let i=0;i<=8;i++)X.lineTo(-w/2+(i%2)*5,-h/2+i*h/8);for(let i=8;i>=0;i--)X.lineTo(w/2-(i%2)*5,-h/2+i*h/8);X.fill();
  X.strokeStyle='rgba(255,255,255,.25)';X.lineWidth=2;for(let i=-w/2+10;i<w/2;i+=18){X.beginPath();X.moveTo(i,-h/2);X.lineTo(i+10,h/2);X.stroke()}X.restore()}
// pop-in transform helper: returns scale with overshoot

function polaroid(x,y,w,h,rot,sc,fn,cap){if(sc<=0)return;X.save();X.translate(x,y);X.rotate(rot);X.scale(sc,sc);shadow(1,24,10);X.fillStyle=PAPER;X.fillRect(-w/2-22,-h/2-22,w+44,h+44+(cap?80:22));shadow(0);

// marker stroke along polyline with progress
function marker(pts,k,col=ACC,w=12,a=1){if(k<=0)return;let L=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}
