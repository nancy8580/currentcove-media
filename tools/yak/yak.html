 back=x=>{x=cl(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},lerp=(a,b,k)=>a+(b-a)*k;

const bg=document.createElement('canvas');bg.width=1480;bg.height=2320;{const g=bg.getContext('2d');const gr=g.createLinearGradient(0,0,0,2320);gr.addColorStop(0,'#070b1d');gr.addColorStop(.6,'#0d1430');gr.addColorStop(1,'#060814');g.fillStyle=gr;g.fillRect(0,0,1480,2320);
 g.strokeStyle='rgba(143,211,255,.07)';g.lineWidth=2;const cx=[[300,500],[1100,900],[600,1700]];
 for(const [x0,y0] of cx)for(let r=40;r<700;r+=38){g.beginPath();for(let i=0;i<=80;i++){const a=i/80*Math.PI*2;const rr=r*(1+.18*Math.sin(a*3+r*.01)+.08*Math.sin(a*5-r*.02));const x=x0+Math.cos(a)*rr,y=y0+Math.sin(a)*rr*.8;i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
 for(let i=0;i<220;i++){g.fillStyle=`rgba(230,240,255,${rnd()*.5})`;g.fillRect(rnd()*1480,rnd()*1100,2,2)}}

 X.font=`${size}px AN`;const w=X.measureText(s).width+size*.6,h=size*1.25;X.strokeStyle=col;X.lineWidth=size*.08;X.strokeRect(-w/2,-h/2,w,h);X.strokeRect(-w/2+size*.1,-h/2+size*.1,w-size*.2,h-size*.2);

  X.fillStyle=u<settle?'rgba(255,176,0,.6)':col;X.fillText(c,cx+cw/2,y+ch/2+size*.04)}X.restore();return s.length*(cw+6)}// ---------- terrain + props
const RIDGES=[0,1,2,3].map(l=>{const pts=[];let s=11+l*7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};let y=0;for(let i=0;i<=28;i++){const x=-80+i*44;y=(Math.sin(i*.55+l)*90+Math.sin(i*1.7+l*2)*40+(r()-.5)*60);pts.push([x,y])}return pts});

  glow(()=>{X.beginPath();pts.forEach(([x,y],i)=>{const p=[x+off,yy+y*(1-l*.15)];i?X.lineTo(...p):X.moveTo(...p)});X.stroke();

function person(x,y,s,u,pick=0,col=SNW,a=1,run=0){X.save();X.translate(x,y);X.scale(s/100,s/100);glow(()=>{X.beginPath();X.arc(0,-150,18,0,7);X.stroke();X.beginPath();X.moveTo(0,-132);X.lineTo(0,-60);
  const sw=run?Math.sin(u*14)*30:0;X.moveTo(0,-60);X.lineTo(-18+sw,0);X.moveTo(0,-60);X.lineTo(18-sw,0);

  // long tunic hem

function yakArt(x,y,s,u,a=1,col=SNW){X.save();X.translate(x,y);X.scale(s/100,s/100);const st=Math.sin(u*5)*10;glow(()=>{
  X.beginPath();X.moveTo(-130,-60);X.bezierCurveTo(-120,-140,-40,-150,10,-130);X.bezierCurveTo(50,-170,100,-150,110,-110);X.lineTo(150,-90);X.lineTo(150,-60);X.lineTo(118,-56);X.bezierCurveTo(100,-30,60,-20,40,-20);X.lineTo(-100,-20);X.bezierCurveTo(-130,-25,-140,-40,-130,-60);X.stroke();

 X.fillStyle='rgba(6,8,20,.86)';X.fillRect(60,1532,960,46);X.font='500 24px JB';X.fillStyle='#ff6a5a';X.textAlign='left';X.fillText('● REAL PHOTO',80,1564);X.fillStyle=SNOW;X.fillText('Kargil district ridges near Drass (2012)',290,1564)}
// ---------- SFX

 for(const sc of SC){const [id,s0,s1]=sc;const add=(dt,k)=>SFX.push([+(s0+dt).toFixed(3),k]);
  if(id!=='hook')add(0,'whoosh');
  ({hook:()=>{add(.02,'rise');add(1.3,'whoosh');add(1.35,'glitch');add(1.5,'thud');add(2.3,'pop');add(2.8,'stamp')},
