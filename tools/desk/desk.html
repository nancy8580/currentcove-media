</style></head><body><canvas id=c width=1080 height=1920></canvas><script>
const C=document.getElementById('c'),X=C.getContext('2d');

const cl=x=>Math.min(1,Math.max(0,x)),ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)},eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},
 back=x=>{x=cl(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},lerp=(a,b,k)=>a+(b-a)*k;
// deterministic noise texture for paper

const tex=document.createElement('canvas');tex.width=540;tex.height=960;{const g=tex.getContext('2d');const im=g.createImageData(540,960);for(let i=0;i<im.data.length;i+=4){const v=rnd()*28;im.data[i]=im.data[i+1]=im.data[i+2]=v>24?0:128;im.data[i+3]=v>24?18:6}g.putImageData(im,0,0);
 for(let k=0;k<60;k++){g.strokeStyle=`rgba(120,100,70,${.03+rnd()*.04})`;g.lineWidth=1+rnd()*2;g.beginPath();const x=rnd()*540,y=rnd()*960;g.moveTo(x,y);g.lineTo(x+rnd()*200-100,y+rnd()*60-30);g.stroke()}}

    const F=[[0,1,2,'#b9b4aa'],[2,3,4,'#8b867c'],[4,5,6,'#a7a297'],[6,7,0,'#7f7a70'],[0,2,4,'#c9c4ba'],[0,4,6,'#9d988e']];
    F.forEach(([a,b,c,col])=>{X.fillStyle=col;X.beginPath();X.moveTo(P[a][0]*r,P[a][1]*r);X.lineTo(P[b][0]*r,P[b][1]*r);X.lineTo(P[c][0]*r,P[c][1]*r);X.closePath();X.fill()})}
  else{shadowed(()=>{X.fillStyle='#dfe9f2';X.beginPath();X.moveTo(-r,-r*.35);X.lineTo(-r*.55,-r*.8);X.lineTo(r*.55,-r*.8);X.lineTo(r,-r*.35);X.lineTo(0,r);X.closePath();X.fill()},18,8,.25);
    X.strokeStyle='#7d93a8';X.lineWidth=Math.max(1,r*.05);X.beginPath();X.moveTo(-r,-r*.35);X.lineTo(r,-r*.35);X.moveTo(-r*.55,-r*.8);X.lineTo(-r*.25,-r*.35);X.lineTo(0,r);X.lineTo(r*.25,-r*.35);X.lineTo(r*.55,-r*.8);X.moveTo(-r*.25,-r*.35);X.lineTo(0,-r*.8);X.lineTo(r*.25,-r*.35);X.moveTo(-r,-r*.35);X.lineTo(0,r);X.lineTo(r,-r*.35);X.stroke();
    X.beginPath();X.moveTo(-r,-r*.35);X.lineTo(-r*.55,-r*.8);X.lineTo(r*.55,-r*.8);X.lineTo(r,-r*.35);X.lineTo(0,r);X.closePath();X.stroke()}
  X.restore()}
function tag(px,py,label,t0,t){const k=(t-t0);if(k<0)return;const sw=Math.sin(k*5)*Math.exp(-k*1.8)*.5+.12;X.save();X.globalAlpha=cl(k*4);X.translate(px,py);X.rotate(sw);
  X.strokeStyle='#6b5a3e';X.lineWidth=3;X.beginPath();X.moveTo(0,0);X.lineTo(0,70);X.stroke();X.translate(0,70);
  shadowed(()=>{X.fillStyle='#f4ead2';X.beginPath();X.moveTo(-40,0);X.lineTo(40,0);X.lineTo(70,40);X.lineTo(70,170);X.lineTo(-70,170);X.lineTo(-70,40);X.closePath();X.fill()},16,8,.3);
  X.fillStyle='#e6d9ba';X.beginPath();X.arc(0,24,9,0,7);X.fill();txt(label,0,120,'52px SER',RED,'center');X.restore()}
// ---------- captions (word by word, serif, red keyword)
function caption(sc,t){const [id,s0,s1,v0,vd,text]=sc;const words=text.split(' ');const tot=text.replace(/\*/g,'').length;let acc=0;const shown=[];
  for(const w of words){const st=v0+vd*acc/tot;acc+=w.replace(/\*/g,'').length+1;if(t>=st-.05)shown.push(w)}
  if(!shown.length)return;X.save();X.font='64px SER';const maxW=920;const L=[[]];let lw=0;
  // keep current sentence chunk: show last ~9 words
  const vis=shown.slice(Math.max(0,shown.length-9-((shown.length-1)%9===8?0:0)));
  const start=Math.floor((shown.length-1)/9)*9;const chunk=shown.slice(start);
  for(const w of chunk){const ww=X.measureText(w.replace(/\*/g,'')+' ').width;if(lw+ww>maxW&&L[L.length-1].length){L.push([]);lw=0}L[L.length-1].push(w);lw+=ww}
  const y0=1560-(L.length-1)*34;L.forEach((ln,i)=>{const full=ln.map(w=>w.replace(/\*/g,'')).join(' ');let x=540-X.measureText(full).width/2;
    ln.forEach(w=>{const red=w.includes('*');const s=w.replace(/\*/g,'');X.fillStyle=red?RED:INK;X.shadowColor='rgba(251,248,241,.9)';X.shadowBlur=14;X.fillText(s,x,y0+i*76);x+=X.measureText(s+' ').width})});X.restore()}
// ---------- red step card
function stepCard(n,lt){if(lt>1.05)return;const inK=ease(lt/.22),outK=eio((lt-.85)/.2);const off=lerp(1080,0,inK)-1080*outK;X.save();X.translate(off,0);

  X.save();X.translate(0,lerp(160,0,ease((lt-.08)/.35)));X.globalAlpha=cl((lt-.08)/.15);txt(String(n),1000,1180,'520px AN','#fbf1e8','right');X.restore();X.restore()}
// ---------- scenes (local time u from when desk shows)
const S={
 hook(u){ // rock drops, tag swings, stamp

    // pie
    const k=ease((u-.7)/2.2),cx=w/2,cy=500,R=250;X.fillStyle='#e9e2d2';X.beginPath();X.arc(cx,cy,R,0,7);X.fill();X.fillStyle=RED;X.beginPath();X.moveTo(cx,cy);X.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*.9*k);X.closePath();X.fill();

  stamp('MONOPOLY',760,1210,.12,3.4,u,72)},
 s2(u){

    for(let r=0;r<6;r++)for(let c=0;c<8;c++){const idx=r*8+c;const out=idx<3&&u>2.0+idx*.5;if(out)continue;gem(115+c*88,250+r*90,30,false)}

      X.strokeStyle='#3c3833';X.lineWidth=4;X.strokeRect(40,200,(w-80)*dk,560);if(dk>.95){X.beginPath();X.arc(w/2,480,70,0,7);X.stroke();X.beginPath();X.moveTo(w/2-70,480);X.lineTo(w/2+70,480);X.moveTo(w/2,410);X.lineTo(w/2,550);X.stroke()}}
    txt('RELEASED THIS YEAR:',60,830,'34px CP',INK);txt(String(Math.min(3,Math.max(0,Math.floor((u-2.0)/.5)+1))),w-60,832,'64px AN',RED,'right')});
  for(let i=0;i<3;i++){const k=(u-2.0-i*.5);if(k<0)continue;gem(250+i*290,1310+Math.min(0,-200+k*900),44,false,.2*i)}},
 s3(u){
  card(540,800,780,980,-.03,enter(.1,u),(w,h)=>{X.fillStyle='#1f2a3a';X.fillRect(30,30,w-60,h-60);
    gem(w/2,360,110,false);X.strokeStyle='#d4b25e';X.lineWidth=14;X.beginPath();X.arc(w/2,560,130,0,7);X.stroke();X.lineWidth=5;X.strokeStyle='#f1d98c';X.beginPath();X.arc(w/2,560,124,Math.PI*1.1,Math.PI*1.6);X.stroke();
    const full='A Diamond is Forever';const n=Math.floor(cl((u-2.0)/1.2)*full.length);X.save();X.font='68px SERI';X.fillStyle='#f3e8cf';X.textAlign='center';X.fillText(full.slice(0,n),w/2,780);X.restore();
    txt('N. W. AYER & SON · FOR DE BEERS',w/2,860,'24px CP','#c9bfa8','center')},'#efe6d2');
  stamp('1947',800,1330,.14,3.7,u,96)},
 s4(u){
  card(540,780,840,900,.02,enter(.1,u),(w,h)=>{txt('SALARY SLIP',60,110,'66px AN',INK);txt('Employee: You',60,160,'30px CP','#555');X.fillStyle=INK;X.fillRect(60,185,w-120,3);
    txt('Monthly salary',60,280,'40px CP',INK);txt('₹ 50,000',w-60,280,'48px SER',INK,'right');lines(60,330,w-120,4,30);
    txt('Ring budget:',60,560,'44px CP',INK);txt('1 month',w-60,560,'56px SER',INK,'right');

    hl(60,700,w-120,60,(u-2.2)/.6);txt('= ₹ 1,00,000 on a stone',w/2,745,'40px CP',INK,'center')});

    if(u>1.6)txt('< 5%',270,base-b1-24,'54px SER',INK,'center');if(u>4.4)txt(Math.round(60*ease((u-4.4)/1.4))+'%',w-270,base-b2-24,'72px SER',RED,'center')});
  stamp('×12',820,1240,.1,6.2,u,110)},
 s6(u){

  stamp('HALF',740,760,-.12,3.0,u,104)},
 end(u){const e=enter(.1,u,.35);X.save();X.globalAlpha=e.a;gem(540,800+lerp(-300,0,ease((u-.1)/.3)),230,true,.1);X.restore();tag(760,540,'₹ ∞',1.0,u);

};
window.frame=t=>{X.setTransform(1,0,0,1,0,0);
 const sc=SC.find(s=>t>=s[1]&&t<s[2])||SC[SC.length-1];const id=sc[0],lt=t-sc[1];const isStep=id[0]==='s';const u=isStep?lt-1.05:lt;

 X.fillStyle=DESK;X.fillRect(-200,-200,1480,2320);X.drawImage(tex,0,0,540,960,-200,-200,1480,2320);
 const g=X.createRadialGradient(540,900,300,540,900,1300);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(60,40,20,.28)');X.fillStyle=g;X.fillRect(-200,-200,1480,2320);

 if(!isStep||u>-0.2)(S[id]||(()=>{}))(u);

 if(dx>2){X.save();X.globalAlpha=Math.min(.5,dx/900);X.filter='blur(14px)';X.drawImage(C,-60,0);X.restore()}

 caption(sc,t);
