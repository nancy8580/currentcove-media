<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:SER;src:url('file:///root/fonts/DMSerifDisplay-Regular.ttf')}
@font-face{font-family:JB;src:url('file:///root/fonts/jetbrains-mono-latin-500-normal.woff2');font-weight:500}
@font-face{font-family:AN;src:url('file:///root/fonts/Anton-Regular.ttf')}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}canvas{position:absolute;inset:0}
</style></head><body><canvas id=o width=1080 height=1920></canvas><script>
const O=document.getElementById('o').getContext('2d'),W=1080,H=1920;
const cl=x=>Math.min(1,Math.max(0,x)),eo=x=>{x=cl(x);return 1-Math.pow(1-x,3)},eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},lerp=(a,b,k)=>a+(b-a)*k,back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const IMG={};['male','il76','godavari','paras'].forEach(n=>{const i=new Image();i.src='file://./media/'+n+'.jpg';IMG[n]=i});
function cover(key,x,y,w,h,fx=.5,fy=.5,z=1,filt='contrast(1.08) saturate(.9)'){const im=IMG[key];const iw=im.naturalWidth,ih=im.naturalHeight;const sr=Math.max(w/iw,h/ih)*z;const sw=w/sr,sh=h/sr;O.save();O.filter=filt;O.drawImage(im,(iw-sw)*fx,(ih-sh)*fy,sw,sh,x,y,w,h);O.restore()}
function photo(key,x,y,w,h,rot,t,t0,t1,label,sub,fx=.5,fy=.5){if(t<t0||t>t1+.45)return;const kin=back((t-t0)/.42),kout=eio((t-t1)/.45);O.save();O.translate(x-kout*1300,lerp(y+1000,y,kin));O.rotate(rot-kout*.35);O.shadowColor='rgba(0,0,0,.65)';O.shadowBlur=46;O.shadowOffsetY=18;O.fillStyle='#f3ecdf';O.fillRect(-w/2-16,-h/2-16,w+32,h+92);O.shadowColor='transparent';
 cover(key,-w/2,-h/2,w,h,fx,fy,1+.06*cl((t-t0)/(t1-t0)));O.fillStyle='rgba(240,215,150,.6)';O.save();O.rotate(.05);O.fillRect(-90,-h/2-34,180,40);O.restore();
 O.font='500 22px JB';O.fillStyle='#1d2a3a';O.fillText(label,-w/2,h/2+42);O.font='500 17px JB';O.fillStyle='#7a6d5a';O.fillText(sub,-w/2,h/2+66);O.textAlign='right';O.fillStyle='#c8322a';O.fillText('● REAL PHOTO',w/2,h/2+42);O.restore()}
function bracket(x,y,s,a){O.save();O.globalAlpha=a;O.strokeStyle='#ff4a3d';O.lineWidth=6;const q=s*.28;[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([i,j])=>{O.beginPath();O.moveTo(x+i*s/2,y+j*s/2-j*q);O.lineTo(x+i*s/2,y+j*s/2);O.lineTo(x+i*s/2-i*q,y+j*s/2);O.stroke()});O.restore()}
window.frame=t=>{O.clearRect(0,0,W,H);
 // HOOK: real Malé, then cut into the animation
 const HC=1.35;if(t<HC+.12){const k=t/HC;cover('male',0,0,W,H,.5,.5,lerp(1.05,1.22,k),'contrast(1.1) saturate(1.05)');O.save();O.globalCompositeOperation='destination-out';const fg=O.createLinearGradient(0,1340,0,1500);fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(1,'rgba(0,0,0,1)');O.fillStyle=fg;O.fillRect(0,1340,W,580);O.restore();
  O.fillStyle='rgba(3,7,15,.25)';O.fillRect(0,0,W,H);const tg=O.createLinearGradient(0,0,0,560);tg.addColorStop(0,'rgba(3,7,15,.8)');tg.addColorStop(1,'rgba(3,7,15,0)');O.fillStyle=tg;O.fillRect(0,0,W,560);
  O.font='500 26px JB';O.fillStyle='#f1e6d2';O.fillText('MALÉ · MALDIVES',60,250);O.fillStyle='#ff6a5a';O.fillText('● REAL PHOTO',60,286);
  O.font='76px SER';O.fillStyle='#f6efe2';O.textAlign='center';O.shadowColor='#000';O.shadowBlur=20;O.fillText('A country, hijacked.',540,420);O.shadowBlur=0;O.textAlign='left';
  bracket(560,1000,lerp(700,420,eo(k*1.6)),cl(t/.15)*(.75+.25*Math.sin(t*20)));O.font='500 24px JB';O.fillStyle='#ff4a3d';O.fillText('TARGET · THE CAPITAL',380,1250);
  if(t>HC){O.fillStyle=`rgba(255,255,255,${.8*(1-(t-HC)/.12)})`;O.fillRect(0,0,W,1500)}}
 // INDIA
 photo('paras',540,880,800,480,-.03,t,19.9,21.6,'INDIAN ARMY PARATROOPERS','the force sent: 50th Independent Parachute Brigade',.35,.5);
 photo('il76',540,850,760,420,.03,t,21.7,23.5,'IAF ILYUSHIN IL-76','the jet type that flew Agra → Hulhulé',.5,.5);
 // NAVY
 photo('godavari',540,900,820,480,-.025,t,35.35,37.6,'INS GODAVARI (lead ship)','one of the two frigates that ran down the hijackers',.42,.55);
 // END credits
 if(t>44.2){O.save();O.globalAlpha=cl((t-44.2)/.4);O.font='500 15px JB';O.fillStyle='rgba(220,225,230,.75)';O.textAlign='center';O.fillText('Photos: steve_l CC BY 2.0 · US DoD / Wikimedia (public domain). Paratrooper, IL-76 & ship photos are later years.',540,1888);O.restore()}
};
Promise.all([document.fonts.load('76px SER'),document.fonts.load('500 24px JB'),...Object.values(IMG).map(i=>i.decode())]).then(()=>window.go=true);
</script></body></html>
