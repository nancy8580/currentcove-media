function head(str,y,t0,t,size=76){X.save();X.font=`800 ${size}px IN`;const ws=str.split(' ');let x=70,yy=y;ws.forEach((w,i)=>{const acc=w.includes('*'),ww=w.replace(/\*/g,'');const mw=X.measureText(ww+' ').width;if(x+mw>1010){x=70;yy+=size*1.12}const k=cl((t-t0-i*.06)/.3);X.globalAlpha=k;X.fillStyle=acc?ACC:WH;if(acc)glow(ACC,22);else X.shadowBlur=0;X.fillText(ww,x,yy+(1-ease(k))*14);x+=mw});X.restore()}

(function(){const pts=[];const w=Math.sqrt(3)*HR;for(let r=-4;r<=4;r++)for(let q=-4;q<=4;q++){const cx=q*w+(r&1?w/2:0),cy=r*1.5*HR;

 if(id==='liquid'||id==='hex'){
   const k=id==='hex'?ease((lt-.4)/2.6):0;const ent=id==='liquid'?cl(lt/.5):1;

   if(id==='hex'){const kb=cl((lt-2.6)/.8);X.save();X.globalAlpha=kb;X.setLineDash([10,12]);X.lineDashOffset=-t*20;X.strokeStyle=ACC;X.lineWidth=3;glow(ACC,10);EDG.forEach(([i,j])=>{X.beginPath();X.moveTo(...LAT[i]);X.lineTo(...LAT[j]);X.stroke()});X.restore();

   for(let i=0;i<N;i++){const p=lqPos(i,t*1.6),q=LAT[i];const vib=(1-k)*0+k*3*Math.sin(t*14+i);
