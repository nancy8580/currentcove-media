</head><body><canvas id=c width=1080 height=1920></canvas><script type="module">

function caption(sc,t){const [id,s0,s1,v0,vd,text]=sc;const parts=text.split(/(?<=[.?!])\s+/).map(s=>s.trim()).filter(Boolean);const tot=text.length;let acc=0,cur=parts[0];
  for(const p of parts){const st=v0+vd*acc/tot;acc+=p.length+1;if(t>=st-.1)cur=p}

 caption(SC[k],t);
