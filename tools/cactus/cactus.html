function head(t,t0,txt){O.save();const k=eo((t-t0)/.3);O.globalAlpha=k;O.font='76px SER';O.textAlign='center';O.fillStyle='#f6efe2';O.shadowColor='rgba(0,0,0,.9)';O.shadowBlur=20;O.fillText(txt,540,400+(1-k)*20);O.restore()}
function clock(txt,x,y,size=110,col='#ffcf7a'){O.save();O.font=`${size}px AN`;O.textAlign='center';O.fillStyle=col;O.shadowColor='#000';O.shadowBlur=20;O.fillText(txt,x,y);O.restore()}
function proj(v){const p=v.clone().project(camera);return [(p.x+1)/2*W,(1-p.y)/2*H,p.z]}
function bracket(x,y,s,col,a=1){O.save();O.globalAlpha=a;O.strokeStyle=col;O.lineWidth=5;const h=s/2,q=s*.28;[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{O.beginPath();O.moveTo(x+a*h-a*q*-1*0+(-a*q),y+b*h);O.lineTo(x+a*h,y+b*h);O.lineTo(x+a*h,y+b*h-b*q);O.stroke()});O.restore()}
function label(x,y,txt,col='#ff4a3d'){O.save();O.font='500 24px JB';const w=O.measureText(txt).width+24;O.fillStyle='rgba(5,10,20,.8)';O.fillRect(x-w/2,y-34,w,40);O.fillStyle=col;O.textAlign='center';O.fillText(txt,x,y-6);O.restore()}
// ---------- camera director
function camSet(p,l){camera.position.copy(p);camera.lookAt(l)}
const SH={
 hook(u){const k=u/5.7;camSet(V(lerp(-80,-30,eio(k)),lerp(55,42,k),lerp(110,95,k)),V(lerp(0,6,k),10,-6))},
 attack(u){const d=TE.attack-T.attack;const s=seizeT-T.attack;if(u<s){const k=u/s;const B=trawlers[0].position;camSet(V(B.x-lerp(30,45,k),lerp(10,20,k),B.z+lerp(36,55,k)),V(B.x+40,2,B.z-40))}else{const k=(u-s)/(d-s);camSet(V(lerp(-6,6,k),lerp(95,105,k),lerp(118,110,k)),V(0,-6,-8))}},
 call(u){camSet(V(Math.sin(u*.12)*40,170,Math.cos(u*.12)*40+20),V(0,0,0))},
 india(u){const k=u/7;const P=planes[0].position;camSet(V(P.x+lerp(-55,-25,eio(k)),P.y+lerp(16,6,eio(k)),lerp(70,60,k)),V(P.x+12,P.y-2,-14))},
 land(u){const ld=at('land','land')-T.land;if(u<ld+1.2)camSet(V(lerp(-95,-85,u/2.2),lerp(20,16,u/2.2),HZ+75),V(lerp(30,-20,eio(u/(ld+1))),lerp(14,4,eio(u/(ld+1))),HZ));else{const k=(u-ld-1.2)/3.6;camSet(V(lerp(40,60,k),lerp(30,90,eio(k)),lerp(HZ+70,90,eio(k))),V(0,0,lerp(HZ,-10,eio(k))))}},
 twist(u){camSet(V(freighter.position.x-30,lerp(20,30,u/4),freighter.position.z+lerp(60,80,u/4)),freighter.position.clone().add(V(10,4,0)))},
 navy(u){const sh=shellT-T.navy;if(u<sh-.2)camSet(V(lerp(30,10,u/sh),lerp(55,40,u/sh),lerp(180,150,u/sh)),V(22,2,0));else{const k=(u-sh)/(6.4-sh);camSet(V(lerp(10,-15,k),lerp(40,58,k),lerp(150,128,k)),V(18,2,0))}},
 end(u){const k=u/5.8;camSet(V(lerp(-20,10,k),lerp(60,140,eio(k)),lerp(120,180,eio(k))),V(0,0,lerp(0,-40,k)))}};
// object choreography
function place(id,u,t){
 // defaults hidden
 trawlers.forEach(b=>b.visible=false);planes.forEach(p=>p.visible=false);freighter.visible=false;frig1.visible=frig2.visible=false;rescue.forEach(b=>b.visible=false);troops.forEach(p=>p.visible=false);heli.visible=false;
 if(id==='hook'||id==='attack'){const s=seizeT-T.attack;trawlers.forEach((b,i)=>{b.visible=id==='attack';const k=eo(cl(u/s));b.position.set(lerp(-170,-50,k)+i*8,0,lerp(150,30,k)+i*18);b.rotation.y=Math.atan2(-(30-150),(-50+170))*-1+.3})}
 if(id==='india'){planes.forEach((p,i)=>{p.visible=true;const x=-200+u*55+i*-34;p.position.set(x,60+i*6+Math.sin(u*1.3+i)*.8,i*-26);p.rotation.set(0,0,Math.sin(u*.8+i)*.03)});ocean.position.x=-(u*40%16)}
 else ocean.position.x=0;
 if(id==='land'){const p=planes[0];p.visible=true;const ld=at('land','land')-T.land;const k=cl(u/ld);p.position.set(lerp(140,-20,k)-Math.max(0,u-ld)*22*Math.max(0,1-(u-ld)/2.5),lerp(40,4.2,eo(k)),HZ);p.rotation.set(0,Math.PI,lerp(-.12,0,k));if(u>ld)p.position.x=-20-eo(cl((u-ld)/2))*30;
  const sz=at('land','seize')-T.land;troops.forEach((tr,i)=>{tr.visible=u>sz-.6;const kk=eo(cl((u-sz+.6-i*.03)/1.4));tr.position.set(lerp(-50,-80+(i%9)*9,kk),.3,HZ+lerp(0,-10+Math.floor(i/9)*8,kk)+(i%2?3:-3));tr.rotation.y=Math.sin(t*6+i)*.3});
  const rp=at('land','reach')-T.land;rescue.forEach((b,i)=>{b.visible=u>rp-1.2;const kk=eio(cl((u-rp+1.2)/2.4));b.position.set(-30+i*20,0,lerp(HZ+18,-30,kk));b.rotation.y=Math.PI/2})}
 if(id==='twist'){freighter.visible=true;const k=u/4.1;freighter.position.set(lerp(40,110,k),0,lerp(35,70,k));freighter.rotation.y=-.45}
 if(id==='navy'){freighter.visible=frig1.visible=frig2.visible=true;freighter.position.set(u*1.5,0,0);freighter.rotation.y=.2;frig1.position.set(lerp(90,42,eo(u/4)),0,lerp(-40,-26,eo(u/4)));frig1.rotation.y=Math.PI+.15;frig2.position.set(lerp(85,38,eo(u/4)),0,lerp(50,30,eo(u/4)));frig2.rotation.y=Math.PI-.25;
  const cm=at('navy','commandos')-T.navy;heli.visible=u>cm-1.6;const hk=eo(cl((u-cm+1.6)/1.6));heli.position.set(lerp(80,u*1.5+2,hk),lerp(40,16,hk),lerp(10,0,hk));heli.rotation.y=Math.PI;heli.userData.rot.rotation.y=t*30}
}
window.frame=t=>{const sc=SC.find(s=>t>=s[1]&&t<s[2])||SC[SC.length-1];const id=sc[0],u=t-sc[1];camera.up.set(0,1,0);
 const dawn=id==='end'?cl(u/4):0;scene.background.copy(NIGHT).lerp(DAWN,dawn);scene.fog.color.copy(scene.background);
 lights.children.forEach((l,i)=>{l.material.opacity=.55+.45*Math.sin(t*5+i*1.7)});
 place(id,u,t);const away=id==='navy';male.visible=hul.visible=lights.visible=!away;
 updTracers(t,id==='hook'||(id==='attack'&&t>seizeT-.3));
 bursts.forEach(b=>updBurst(b,t));
 let shk=0;BOOMS.forEach(([x,k,s])=>{if(t>x&&t<x+.5)shk+=(1-(t-x)/.5)*(k==='boom'?1:.6)});
 (SH[id]||(()=>{}))(u,t);if(shk>0){camera.position.x+=(hash(t*91)-.5)*3*shk;camera.position.y+=(hash(t*77)-.5)*3*shk}
 camera.updateMatrixWorld();renderer.render(scene,camera);
 // ---- overlay
 O.clearRect(0,0,W,H);
 // top gradient for legibility
 const tg=O.createLinearGradient(0,0,0,520);tg.addColorStop(0,'rgba(3,7,15,.75)');tg.addColorStop(1,'rgba(3,7,15,0)');O.fillStyle=tg;O.fillRect(0,0,W,520);
 const bg=O.createLinearGradient(0,1380,0,1920);bg.addColorStop(0,'rgba(3,7,15,0)');bg.addColorStop(1,'rgba(3,7,15,.8)');O.fillStyle=bg;O.fillRect(0,1380,W,540);
 if(id==='hook'){meta('MALÉ · MALDIVES','3 NOVEMBER 1988');head(t,-1,'A country, hijacked.');stamp('COUP',540,1180,-.07,t,at('hook','country'),130)}
 if(id==='attack'){meta('MALÉ · 04:15','hired mercenaries arrive by sea');const s=seizeT;const mins=15+Math.floor(u*1.4);clock(`04:${String(Math.min(59,mins)).padStart(2,'0')}`,540,440,120);
  statCard(700,1200,'~150',['MERCENARIES','landed by sea, before dawn'],t,at('attack','150'),-.03);
  if(t>s-.1){TARGETS.forEach(([o,p,name],i)=>{const tt=s+i*.45;if(t<tt)return;const [x,y,z]=proj(p);if(z>1)return;const k=eo((t-tt)/.25);bracket(x,y+40,lerp(260,150,k),'#ff4a3d',k*(t>tt+.3?.6+.4*Math.sin(t*18):1));label(x,y-50,name)})}}
 if(id==='call'){O.fillStyle='rgba(4,8,16,.45)';O.fillRect(0,0,W,H);meta('SOS · 3 NOV 1988','President Gayoom, in hiding');
  paper(540,860,800,620,-.025,t,T.call+.05,(w,h)=>{O.font='500 24px JB';O.fillStyle='#6d5e4b';O.fillText('TELEX · MOST URGENT',40,60);O.fillStyle='#c8322a';O.fillRect(40,80,w-80,4);O.font='40px TY';O.fillStyle='#1d1a16';
   const rows=[['→ USA','?'],['→ UK','?'],['→ SRI LANKA','?'],['→ INDIA','?']];const hp=at('call','help');rows.forEach((r,i)=>{const k=cl((t-hp+.6-i*.25)/.2);if(k<=0)return;O.globalAlpha=k;O.fillText(r[0],60,170+i*80);O.globalAlpha=1});
   O.font='26px IN';O.fillStyle='#3a3127';if(t>at('call','America'))O.fillText('US forces nearest: Diego Garcia',60,520)});
  if(t>at('call','two'))stamp('2–3 DAYS',540,1260,-.06,t,at('call','two'),120)}
 if(id==='india'){meta('AGRA AIR FORCE STATION','50th Independent Parachute Brigade');stamp('TONIGHT',540,500,-.05,t,at('india','tonight'),130,'#ffcf7a');
  const ns=at('india','non');if(t>at('india','Agra')){paper(540,1180,700,230,.02,t,at('india','Agra'),(w,h)=>{O.font='500 22px JB';O.fillStyle='#6d5e4b';O.fillText('AGRA → MALÉ · STRAIGHT LINE',30,44);const km=Math.round(2600*eo((t-at('india','Agra')-.3)/1.6));O.font='92px SER';O.fillStyle='#c8322a';O.fillText(km.toLocaleString('en-IN')+' km',30,148);O.font='24px IN';O.fillStyle='#3a3127';O.fillText(t>ns?'two IL-76s · non-stop':'',30,196)})}}
 if(id==='land'){meta('HULHULÉ AIRPORT','across the water from Malé');const nh=at('land','Nine');clock('+9 HRS',540,470,130,'#ffcf7a');
  const sz=at('land','seize');if(t>sz){const [x,y,z]=proj(V(-20,6,HZ));stamp('AIRPORT SECURED',540,700,-.04,t,sz,80,'#7fe0a0')}
  const rp=at('land','President');if(t>rp)stamp('PRESIDENT SAFE',540,1250,.05,t,rp,96,'#7fe0a0')}
 if(id==='twist'){const al=.18+.12*Math.sin(t*14);O.fillStyle=`rgba(200,20,20,${al})`;O.fillRect(0,0,W,H);meta('4 NOV 1988 · MALÉ HARBOUR','hijacked freighter heads out');
  const [x,y,z]=proj(freighter.position.clone().add(V(0,18,0)));if(z<1)label(x,y+260,'MV PROGRESS LIGHT','#ffcf7a');stamp('ESCAPED',540,560,-.06,t,at('twist','escape'),100);if(t>at('twist','hostages'))stamp('HOSTAGES ON BOARD',540,1200,.04,t,at('twist','hostages'),76)}
 if(id==='navy'){meta('INDIAN OCEAN','INS Godavari · INS Betwa');const [x,y,z]=proj(freighter.position.clone().add(V(0,16,0)));if(z<1&&u>.5)bracket(x,y+70,220,'#ff4a3d',.7+.3*Math.sin(t*16));
  const [fx,fy]=proj(frig1.position.clone().add(V(0,26,0)));if(u<shellT-T.navy+1.5)label(fx,fy,'INS GODAVARI','#bfe3ff');
  BOOMS.filter(b=>b[1]==='splash').forEach(([bt])=>{if(t>bt-.35&&t<bt-.2){O.fillStyle='rgba(255,230,180,.1)';O.fillRect(0,0,W,H)}});
  const cm=at('navy','commandos');if(t>cm)stamp('BOARDED',540,520,-.05,t,cm,130,'#7fe0a0');if(t>at('navy','over'))stamp('OPERATION CACTUS',540,1220,.03,t,at('navy','over'),84,'#ffcf7a')}
 if(id==='end'){meta('AFTERMATH','captured mercenaries handed back for trial');paper(540,900,860,520,-.02,t,T.end+.15,(w,h)=>{O.font='500 22px JB';O.fillStyle='#6d5e4b';O.fillText('LONDON · NOVEMBER 1988',40,60);O.font='96px SERI';O.fillStyle='#1d1a16';O.fillText('“Thank God',40,210);O.fillStyle='#c8322a';O.fillText('for India.”',40,320);O.font='26px IN';O.fillStyle='#3a3127';O.fillText('— Margaret Thatcher, UK Prime Minister (as reported)',40,430)});
  const fo=TE.end-1.5;if(t>fo){O.save();O.globalAlpha=cl((t-fo)/.3);O.font='500 34px JB';O.fillStyle='#f6efe2';O.textAlign='center';O.fillText('Follow @currentcove_',540,1440);O.restore()}}
 O.save();O.font='500 22px JB';O.fillStyle='#8fb4d8';O.textAlign='right';O.fillText('CURRENT COVE · OPERATIONS',1020,170);O.textAlign='center';O.fillStyle='rgba(240,230,210,.6)';O.fillText('@currentcove_',540,1850);O.restore();
 caption(t);
 for(let i=0;i<400;i++){O.fillStyle=`rgba(220,235,255,${hash(i+t*31)*.05})`;O.fillRect(hash(i*3+t*17)*W,hash(i*7+t*13)*H,2,2)}const vg=O.createRadialGradient(540,960,620,540,960,1300);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');O.fillStyle=vg;O.fillRect(0,0,W,H);
 // whip flash at cuts
 SC.forEach((s,i)=>{if(i&&t>=s[1]&&t<s[1]+.12){O.fillStyle=`rgba(255,255,255,${.35*(1-(t-s[1])/.12)})`;O.fillRect(0,0,W,H)}})};
window.SFXL=()=>{const A=[];const add=(t,k)=>{if(t>=0)A.push([+t.toFixed(3),k])};SC.forEach((s,i)=>{if(i)add(s[1],'whoosh')});BOOMS.forEach(([t,k])=>add(t,k));add(.05,'boom');
 add(at('hook','country'),'stamp');add(at('attack','150'),'paper');add(seizeT,'alarm');add(T.call+.05,'paper');add(at('call','help')-.6,'type');add(at('call','two'),'stamp');add(at('india','tonight'),'stamp');add(T.india+.2,'jet');add(at('india','Agra'),'paper');
 add(T.land+.2,'jet');add(at('land','seize'),'stamp');add(at('land','President'),'stamp');add(at('twist','escape'),'stamp');add(T.twist+.1,'alarm');add(at('twist','hostages'),'stamp');add(at('navy','commandos')-1.6,'heli');add(at('navy','commandos'),'stamp');add(at('navy','over'),'stamp');add(T.end+.15,'paper');add(TE.end-1.5,'beep');return A.sort((a,b)=>a[0]-b[0])};
